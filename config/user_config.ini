[Settings]
; 开启更新
open_update = True
; 读取你的自定义频道模板
source_file = config/user_demo.txt
; 输出到单独的文件，方便 TVBox 订阅
final_file = output/user_result.txt
; 每个频道保留5个备用接口，防止卡顿
output_urls_limit = 5
; 开启测速和分辨率过滤，保证电视上观看的流畅度
open_speed_test = True
speed_test_mode = quick
open_filter_resolution = True
min_resolution = 1280x720
open_filter_speed = True
min_speed = 0.5
; 关闭截图和RTMP推流，因为 GitHub Actions 无法为你的本地电视网络提供推流服务，还会浪费运行时间
open_stream_screenshot = False
open_rtmp = False
; 强制使用 IPv4 或全部，电视盒子对 IPv6 兼容性通常较差
ipv_type = ipv4
; 结果按速度排序
sort_by = speed
